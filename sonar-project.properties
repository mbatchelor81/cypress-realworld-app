# Exclude seed/test data files from secrets detection rules.
# The data/ directory contains seed JSON files with bcrypt hashes of the
# well-known dev password (s3cret). These are not real credentials.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=secrets:S8215
sonar.issue.ignore.multicriteria.e1.resourceKey=data/**
