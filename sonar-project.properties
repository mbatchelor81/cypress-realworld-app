# SonarCloud configuration for Cypress Real World App
#
# Exclude test seed/fixture data files from the secrets:S8215 rule.
# The bcrypt password hashes in these JSON files are intentional test fixtures
# (all users share the demo password "s3cret") and are not real credentials.
# JSON files do not support inline NOSONAR comments, so we exclude them here.

sonar.issue.ignore.multicriteria=s1

# Ignore secrets:S8215 (bcrypt password hash detection) in seed/fixture data files
sonar.issue.ignore.multicriteria.s1.ruleKey=secrets:S8215
sonar.issue.ignore.multicriteria.s1.resourceKey=data/**/*.json
