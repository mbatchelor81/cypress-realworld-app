name: Devin CLI — Auto-generate Tests
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  generate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Devin CLI credentials
        run: |
          mkdir -p ~/.local/share/cognition
          echo "windsurf_api_key = \"${{ secrets.WINDSURF_API_KEY }}\"" \
            > ~/.local/share/cognition/credentials.toml

      - name: Install Devin CLI
        run: |
          echo "n" | curl -fsSL https://cli.devin.ai/install.sh | bash || true
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Devin CLI
        run: devin --version

      - name: Step 1 — Analyze and generate tests
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.ts' '*.tsx')
          devin -p --permission-mode dangerous \
            -- "These files changed in this PR: $CHANGED.
                1. Analyze each file and identify which functions/components lack unit test coverage.
                2. Write unit tests for each uncovered function. Follow the existing test patterns in cypress/tests/ and src/__tests__/. Use Jest and React Testing Library. Place tests next to source files.
                3. Run 'npx jest --passWithNoTests' to verify all tests pass. If any fail, fix them."

      - name: Commit generated tests
        run: |
          git config user.name "Devin CLI"
          git config user.email "devin-cli@ci"
          git add -A
          git diff --cached --quiet || git commit -m "test: auto-generate unit tests for PR changes"
          git push
