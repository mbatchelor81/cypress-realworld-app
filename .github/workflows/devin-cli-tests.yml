name: Devin CLI — Auto-generate Tests
on:
  pull_request:
    types: [opened, synchronize]
    branches-ignore:
      - 'devin/**'

permissions:
  contents: write

jobs:
  generate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Devin CLI credentials
        run: |
          mkdir -p "$HOME/.local/share/cognition"
          echo "windsurf_api_key = \"${{ secrets.WINDSURF_API_KEY }}\"" \
            > "$HOME/.local/share/cognition/credentials.toml"
          echo "Credentials file written to $HOME/.local/share/cognition/credentials.toml"
          cat "$HOME/.local/share/cognition/credentials.toml" | head -c 30
          echo "..."

      - name: Install Devin CLI
        run: |
          echo "n" | curl -fsSL https://cli.devin.ai/install.sh | bash || true
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Debug CLI auth
        run: |
          devin --version
          devin --help 2>&1 || true
          devin auth --help 2>&1 || true
          devin auth status 2>&1 || true
          ls -la "$HOME/.local/share/cognition/"

      - name: Generate and verify tests
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.ts' '*.tsx')
          if [ -z "$CHANGED" ]; then echo "No TS/TSX files changed — skipping"; exit 0; fi

          devin -p --permission-mode dangerous -- "
            You are running inside CI.

            These files changed in this PR:
            $CHANGED

            TASK:
            1. Identify uncovered functions/components.
            2. Generate Jest + React Testing Library tests.
            3. Place tests next to source files.
            4. Run: npx jest --passWithNoTests
            5. If tests fail, fix them until they pass.
            6. Exit non-zero if unable to produce passing tests.

            Only modify test files.
            Do not modify source files.
          "

      - name: Commit generated tests
        run: |
          git config user.name "Devin CLI"
          git config user.email "devin-cli@ci"
          git add -A
          git diff --cached --quiet || git commit -m "test: auto-generate unit tests for PR changes"
          git push
